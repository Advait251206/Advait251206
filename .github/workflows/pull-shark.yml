name: Pull Shark Automator

on:
  schedule:
    # Runs twice a day at 02:33 UTC (08:03 AM IST) and 14:33 UTC (08:03 PM IST)
    - cron: "33 2,14 * * *"
  workflow_dispatch:

jobs:
  pull_shark:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Global Pull Shark Script
        env:
          # This token bypasses the sandbox and acts as you globally
          GH_TOKEN: ${{ secrets.PULL_SHARK_PAT }}
        run: |
          # 1. Setup Git to authenticate via the GitHub CLI securely
          gh auth setup-git
          
          git config --global user.email "advaitkawale@gmail.com"
          git config --global user.name "Advait251206"
          
          # 2. Fetch all repositories owned by you (source repos only, ignoring archived)
          echo "Scanning your GitHub account for repositories..."
          REPOS=($(gh repo list Advait251206 --source --no-archived -L 100 --json nameWithOwner -q '.[].nameWithOwner'))
          
          if [ ${#REPOS[@]} -eq 0 ]; then
            echo "Error: No repositories found!"
            exit 1
          fi
          
          # 3. Pick a random repository
          RANDOM_INDEX=$((RANDOM % ${#REPOS[@]}))
          SELECTED_REPO=${REPOS[$RANDOM_INDEX]}
          
          echo "🎯 Randomly selected repository: $SELECTED_REPO"
          
          # 4. Clone the chosen repository
          gh repo clone "$SELECTED_REPO" temp-repo
          cd temp-repo
          
          # 5. Create a unique temporary branch
          BRANCH_NAME="pull-shark-$(date +%s)-$RANDOM"
          git checkout -b "$BRANCH_NAME"
          
          # 6. Make an empty commit
          git commit --allow-empty -m "🔥 Automated Pull Shark achievement PR"
          
          # 7. Push the branch to the selected repo
          git push origin "$BRANCH_NAME"
          
          # 8. Create the Pull Request
          echo "Opening Pull Request..."
          PR_URL=$(gh pr create --title "Pull Shark Automated Update" --body "Automated empty PR to increment Pull Shark badge." --head "$BRANCH_NAME")
          echo "✅ Created PR: $PR_URL"
          
          # 9. Merge the Pull Request and delete the temporary branch
          echo "Attempting to instantly merge the PR..."
          gh pr merge "$PR_URL" --merge --delete-branch || {
            echo "❌ Failed to merge automatically! This repo might have strict branch protections."
            echo "Closing PR and deleting branch to keep your repo clean..."
            gh pr close "$PR_URL" --delete-branch
            exit 1
          }
          
          echo "🦈 Pull Shark incremented successfully!"
